    <style>
        /* 전체 배경과 폰트 설정 */
        body {

            background-color: #f0f9ff; /* 심즈 느낌의 연한 하늘색 */
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;

        }

        /* 중앙 콘텐츠 영역 */
        .container {

            display: flex;

            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 버튼 스타일 */

        }

        .btn {

            font-size: 18px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 50px; /* 둥근 버튼 */

        }

        /* 규칙 확인하기 버튼 (초록색 계열) */
        .btn-rules { background-color: #4caf50; }

        /* 랜덤 생성기 버튼 (파란색 계열) */
        .btn-random { background-color: #2196f3; }
        .btn-random:hover { background-color: #1e88e5; transform: scale(1.05); }

        /* 하단 문구 스타일 */
        footer {
            padding: 20px;
            font-size: 12px;
            color: #888;
        }
        /* 설명 문구 스타일 */
.description {
    margin-bottom: 30px; /* 버튼과의 간격 */
    line-height: 1.6;
    color: #555;
    max-width: 600px; /* 너무 길게 퍼지지 않게 방지 */
    word-break: keep-all; /* 한글 단어가 어색하게 끊기지 않게 함 */
}

.description p {
    margin: 10px 0;
}
